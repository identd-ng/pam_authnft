# Configuration for zizmor, the workflow auditor run by the workflows job in
# .github/workflows/analyze.yml.

rules:
  unpinned-uses:
    config:
      policies:
        # The one action in this repo that is not hash-pinned. slsa-verifier
        # trusts the generator only when it is called at a released tag, so
        # pinning it to a commit would break provenance verification. The
        # same reasoning is written out at the call site in
        # release-provenance.yml. Any other subpath or ref under
        # slsa-framework/ still has to be hash-pinned.
        slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml: ref-pin
        "*": hash-pin
